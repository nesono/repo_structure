name: Prek

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        run: pip install uv
      - name: Install development dependencies
        run: pip install -e .[dev]
      - uses: j178/prek-action@v2.0.6
