[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "repo-structure"
authors = [{name = "Jochen Issing", email = "c.333+git@nesono.com"}]
description = "Check the directory structure of your repository"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "BSD-3-Clause"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "click",
    "ruamel-yaml",
    "gitignore-parser",
    "jsonschema",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pylint",
    "pytest-cov",
    "pytest-benchmark",
    "poetry-plugin-export",
]

[project.scripts]
repo_structure = "repo_structure.__main__:repo_structure"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "repo_structure/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["repo_structure"]
# Tests live beside the modules they test (see CLAUDE.md); strip them from the
# wheel here rather than relocating them. Hatchling matches file patterns,
# which setuptools' packages.find exclude cannot do.
# repo_structure.yaml describes this directory for the tool's own self-scan and
# is not runtime data, so it stays out of the wheel too.
exclude = [
    "*_test.py",
    "test_lib.py",
    "test_config_*.yaml",
    "repo_structure.yaml",
]

[tool.coverage.run]
omit = [
    "repo_structure/_version.py",
]
